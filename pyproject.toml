[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-tracker"
version = "0.1.0"
description = "Rastreador flexível e multi-provedor de voos para Itacaré (Ano Novo 2026/2027)"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
flight-tracker = "flight_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
